services:
  web:
    build: 
        context: ./Forge_backend
        dockerfile: ../Dockerfile
    container_name: forge_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./Forge_backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./Forge_backend/.env
    depends_on:
      - db
      - redis
  db:
    image: postgres:17
    container_name: forge_db
    restart: unless-stopped
    env_file:
      - ./Forge_backend/.env
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: forge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  celery:
    build: 
        context: ./Forge_backend
        dockerfile: ../Dockerfile
    container_name: talentforge_celery
    command: celery -A config.celery:app worker --loglevel=info
    volumes:
      - ./Forge_backend:/app
    env_file:
      - ./Forge_backend/.env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
